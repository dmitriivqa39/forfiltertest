<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Filtering log test page</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #dfe3ea;
    --text: #1b2330;
    --muted: #5f6b7c;
    --ok: #157f45;
    --bad: #b3261e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #12161c;
      --panel: #1a2029;
      --line: #2a323d;
      --text: #e6ebf2;
      --muted: #97a3b4;
      --ok: #4fbf82;
      --bad: #f08a80;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: -.01em;
  }

  p { margin: 0 0 14px; }

  .lede { color: var(--muted); }

  .promo-banner {
    margin: 22px 0;
    padding: 14px 16px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
  }

  table {
    width: 100%;
    margin-top: 18px;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    font-size: 14px;
  }

  th, td {
    padding: 9px 12px;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }

  tr:last-child td { border-bottom: 0; }

  th {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
  }

  td.url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    word-break: break-all;
  }

  td.result { white-space: nowrap; }
  td.result.sent { color: var(--ok); }
  td.result.failed { color: var(--bad); }
  td.result.pending { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Filtering log test page</h1>
  <p class="lede">
    This page sends six requests to its own host and four requests to other hosts.
    Everything starts on load, once per reload.
  </p>

  <div class="promo-banner">
    Promo banner. A cosmetic rule can hide this element; nothing else on the page uses this class.
  </div>

  <table>
    <thead>
      <tr>
        <th>Request</th>
        <th>Party</th>
        <th>Result</th>
      </tr>
    </thead>
    <tbody id="probes"></tbody>
  </table>
</main>

<script>
(() => {
  'use strict';

  const probes = [
    { path: 'ads/banner.png', party: '1P' },
    { path: 'ads/promo.css', party: '1P' },
    { path: 'ads/tracker.js', party: '1P' },
    { path: 'ads/partner.js', party: '1P' },
    { path: 'data.json', party: '1P' },
    { path: 'logo.txt', party: '1P' },
    { url: 'https://www.google.com/generate_204', party: '3P' },
    { url: 'https://cloudflare.com/cdn-cgi/trace', party: '3P' },
    { url: 'https://api.github.com/zen', party: '3P' },
    { url: 'https://en.wikipedia.org/robots.txt', party: '3P' }
  ];

  const tbody = document.getElementById('probes');

  function urlOf(probe) {
    return probe.url || new URL(probe.path, document.baseURI).href;
  }

  function addRow(probe) {
    const tr = document.createElement('tr');

    const url = document.createElement('td');
    url.className = 'url';
    url.textContent = urlOf(probe);

    const party = document.createElement('td');
    party.textContent = probe.party;

    const result = document.createElement('td');
    result.className = 'result pending';
    result.textContent = 'pending';

    tr.append(url, party, result);
    tbody.appendChild(tr);

    return result;
  }

  async function fire(probe, cell) {
    try {
      const response = await fetch(urlOf(probe), {
        mode: probe.url ? 'no-cors' : 'same-origin',
        credentials: 'omit',
        cache: 'no-store',
        referrerPolicy: 'no-referrer'
      });

      cell.className = 'result sent';
      cell.textContent = response.type === 'opaque' ? 'sent' : 'HTTP ' + response.status;
    } catch (error) {
      cell.className = 'result failed';
      cell.textContent = 'no response';
    }
  }

  probes.forEach((probe) => {
    fire(probe, addRow(probe));
  });
})();
</script>
</body>
</html>
